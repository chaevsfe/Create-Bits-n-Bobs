name: Build

on:
  push:
    branches: [fabric-26.2]
  pull_request:
    branches: [fabric-26.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Strut Your Stuff jar this mod compiles against
        env:
          STRUTS_JAR_NAME: StrutYourStuff-1.3.1-fly.26.2-beta.3+fabric-mc26.2.jar
          STRUTS_JAR_URL: https://github.com/chaevsfe/StrutYourStuff/releases/download/1.3.1-fly.26.2-beta.3/StrutYourStuff-1.3.1-fly.26.2-beta.3%2Bfabric-mc26.2.jar
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/$STRUTS_JAR_NAME" "$STRUTS_JAR_URL"

      - name: Fetch the Create Fly Recipe Viewer jar this mod nests
        env:
          VIEWER_JAR_NAME: CreateReiViewer-1.0.0-fly.26.2-beta.4+fabric-mc26.2.jar
          VIEWER_JAR_URL: https://github.com/chaevsfe/CreateReiViewer-Fly/releases/download/1.0.0-fly.26.2-beta.4/CreateReiViewer-1.0.0-fly.26.2-beta.4%2Bfabric-mc26.2.jar
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/$VIEWER_JAR_NAME" "$VIEWER_JAR_URL"

      - name: Build from scratch
        run: ./gradlew clean build --no-build-cache --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: bits_n_bobs-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
